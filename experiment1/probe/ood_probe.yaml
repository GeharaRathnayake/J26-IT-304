version: "1.0"
frozen_at_unit: U4
note: >-
  Out-of-distribution probe for the baseline confusion classifier. It holds 40 short utterances of the
  kind the deployed tutor will receive from students (explicit confusion, topic confusion, hedged
  attempts, explicit understanding). The training data contains none of these: it has no hedging
  and every answer is a confident statement. The set was written by hand in unit U4, before any
  model existed, without looking at the training answers, and is frozen from that commit. It is
  never used for training, tuning or threshold selection and is never averaged into test metrics; it
  is reported separately. A low score is expected: it quantifies the gap between the correctness
  proxy and real confusion, and is the evidence for the rule layer, whose phrase list is seeded
  from this file.
items:
  # explicit_confusion: bare statements, expected confused
  - {id: e01, text: "I don't understand", expected: confused, category: explicit_confusion}
  - {id: e02, text: "I’m lost", expected: confused, category: explicit_confusion}
  - {id: e03, text: "no idea", expected: confused, category: explicit_confusion}
  - {id: e04, text: "can you explain that again", expected: confused, category: explicit_confusion}
  - {id: e05, text: "what do you mean", expected: confused, category: explicit_confusion}
  - {id: e06, text: "wait, I don’t follow", expected: confused, category: explicit_confusion}
  - {id: e07, text: "this makes no sense to me", expected: confused, category: explicit_confusion}
  - {id: e08, text: "im so confused right now", expected: confused, category: explicit_confusion}
  - {id: e09, text: "i dont get it", expected: confused, category: explicit_confusion}
