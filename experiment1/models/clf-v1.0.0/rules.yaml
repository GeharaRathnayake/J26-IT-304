# rules.yaml: explicit-phrase rule layer, versioned with the model (clf-v1.0.0). ADR-04.
#
# MATCHING RULE (implement exactly this; confusion_baseline/rules.py is the reference implementation):
#   1. normalise the student message: lowercase; replace U+2018 and U+2019 with an ASCII apostrophe (');
#      collapse every run of whitespace to one space; strip. Nothing else (punctuation is kept).
#   2. match each phrase as a WHOLE-WORD SEQUENCE: regex  \b<phrase>\b  on the normalised text (re.escape the
#      phrase). This is not a raw substring test: 'no idea' does not match 'no ideal'.
#   3. check confusion_phrases first, then understanding_phrases, each in the order listed below.
#      The FIRST match decides: confusion_phrases -> 'confused', understanding_phrases -> 'understood'.
#   4. no match: fall through to the model (pipeline.predict_proba, column 1 = P(confused), threshold 0.5).
#      A decision made by a phrase is reported with source = 'rule'; otherwise source = 'model'.
#   Every phrase below is already in normalised form (lowercase, ASCII apostrophe, single spaces).
#
# KNOWN FALSE TRIGGERS AND LIMITS (not fixed; the phrase list is deliberately explicit):
#   - 'got it' fires inside 'I got it from the docs': reported 'understood' (wrong). 'I got it wrong' is NOT a
#     false trigger: 'got it wrong' is a confusion phrase, and the confusion list is checked first.
#   - 'that makes sense' fires on 'that makes sense in theory but I cannot do it': reported 'understood'
#     (the student is only partly following). 'none of that makes sense' is handled by checking the confusion
#     list first (it has its own phrase), but novel negations are not.
#   - 'doesn't make sense' / 'what do you mean' also occur when a student CHALLENGES the tutor's answer; they are
#     treated as confusion on purpose, because that is the safer error for a tutor.
#   - Phrases with extra words inserted do not match: 'i am so lost' misses (only 'i am lost' is listed) and falls
#     through to the model. Whole-word matching prevents 'no ideal' / 'forgot it' style hits, not paraphrase.
#   - 'i see now' fires on 'I see now that I was right': reported 'understood'.
#   - Order matters: 'got it, but now I'm lost again' is 'confused' because the confusion list is checked first.
#   - The phrase list is seeded from the spec and probe/ood_probe.yaml, so rule accuracy measured on that probe would
#     be circular and is NOT reported anywhere.

version: "1.0"

confusion_phrases:
  - "i don't understand"
  - "i dont understand"
  - "i'm lost"
  - "no idea"
  - "what do you mean"
  - "explain again"
  - "i do not understand"
  - "i didn't understand"
  - "i didnt understand"
  - "i don't really understand"
  - "i dont really understand"
  - "im lost"
  - "i am lost"
  - "i'm completely lost"
  - "im completely lost"
  - "i'm totally lost"
  - "im totally lost"
  - "i'm confused"
  - "im confused"
  - "i am confused"
  - "i'm so confused"
  - "im so confused"
  - "i'm still confused"
  - "still confused"
  - "don't get it"
  - "dont get it"
  - "don't follow"
  - "dont follow"
  - "i'm not following"
  - "im not following"
  - "not following how"
  - "not following what"
  - "no clue"
  - "got it wrong"
  - "got that wrong"
  - "idk"
  - "i'm stuck"
  - "im stuck"
  - "i am stuck"
  - "makes no sense"
  - "doesn't make sense"
  - "doesnt make sense"
  - "does not make sense"
  - "none of that makes sense"
  - "none of this makes sense"
  - "none of it makes sense"
  - "nothing makes sense"
  - "explain that again"
  - "explain it again"
  - "explain this again"
  - "over my head"

understanding_phrases:
  - "that makes sense"
  - "got it"
  - "i see now"
  - "makes sense now"
  - "now i see"
  - "oh i see"
  - "ok i see"
  - "i get it now"
  - "i understand now"
  - "now i understand"
  - "i understand it now"
  - "that's clear"
  - "thats clear"
  - "that clears it up"
  - "that cleared it up"
  - "that's what i was missing"
  - "thats what i was missing"
  - "that's exactly what i was missing"
  - "thats exactly what i was missing"
